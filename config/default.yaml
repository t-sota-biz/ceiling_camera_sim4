# ============================================================
# 天井カメラ・キャリブレーション検証ツール デフォルト設定
# 単位: 距離 = mm, 角度 = deg
# 座標系: 右手系・Z up（床=0, 天井=+H）
# ============================================================

camera:
  # --- 内部パラメータ（解像度と画角から自動でfx,fy,cx,cyを計算） ---
  intrinsics:
    width: 1280              # 画像幅 [px]
    height: 720              # 画像高さ [px]
    fov_h_deg: 80.0          # 水平画角 [deg]
    fov_v_deg: null          # 垂直画角 [deg]。null の場合は width/height と fov_h から自動計算
    auto_fov_v: true         # true: fov_v を自動計算（正方ピクセル仮定）

  # --- 外部パラメータ（基準姿勢） ---
  # 内部的にベース姿勢 R_base_down（真下向き）を保持しており、
  # ここで指定する yaw/pitch/roll は「真下を向いた状態からのずれ」を表す。
  # したがって yaw=pitch=roll=0 でカメラはちょうど真下を向く。
  extrinsics_base:
    position_mm: [2500.0, 2500.0, 3000.0]   # (x, y, z) ワールド座標
    rotation_deg:
      yaw: 0.0
      pitch: 0.0
      roll: 0.0

  # --- ずれ量（基準姿勢からの差分。UIから動的変更） ---
  offset:
    dx_mm: 0.0
    dy_mm: 0.0
    dz_mm: 0.0
    dpitch_deg: 0.0
    dyaw_deg: 0.0
    droll_deg: 0.0

scene:
  room:
    size_mm: [5000.0, 5000.0, 3000.0]   # (W, D, H)
  floor:
    color: [180, 180, 180]              # RGB 0-255
  pillars:                                # 4本の柱（直方体の対角2点で定義）
    - name: pillar_NE
      p_min_mm: [4150.0, 3150.0,    0.0]
      p_max_mm: [4450.0, 3450.0, 2900.0]
      color: [120, 80, 60]
    - name: pillar_NW
      p_min_mm: [ 550.0, 3150.0,    0.0]
      p_max_mm: [ 850.0, 3450.0, 2900.0]
      color: [120, 80, 60]
    - name: pillar_SE
      p_min_mm: [4150.0, 1550.0,    0.0]
      p_max_mm: [4450.0, 1850.0, 2900.0]
      color: [120, 80, 60]
    - name: pillar_SW
      p_min_mm: [ 550.0, 1550.0,    0.0]
      p_max_mm: [ 850.0, 1850.0, 2900.0]
      color: [120, 80, 60]
  table:                                  # テーブル（簡略: 直方体1個）
    p_min_mm: [1900.0, 2100.0,   0.0]
    p_max_mm: [3100.0, 2900.0, 750.0]
    color: [200, 180, 140]

markers:
  mode: "3d"                              # "3d" または "2d"
  items:
    - name: marker_center
      center_mm: [2500.0, 2500.0, 750.0]  # テーブル上面中央
      size_mm:   [200.0, 200.0]           # 縦, 横
      color: [220, 40, 40]

render:
  background_color: [30, 30, 30]
  draw_world_axes: true
  noise:
    enabled: false
    gaussian_sigma: 1.5
    blur_ksize: 0

ui:
  theme: "dark"                           # "dark" or "light"
  language: "ja"
  image_layout: "column"      # "row" (横並び3枚) / "column" (縦並び3枚) / "tabs"

logging:
  level: "INFO"                           # DEBUG/INFO/WARNING/ERROR
  to_file: false
  file_path: "ceiling_cam.log"
